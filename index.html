<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday JORY</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a0a0a;
    color: #f5e6d0;
    font-family: 'Cormorant Garamond', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Petals */
  .petal {
    position: fixed;
    width: 10px;
    height: 14px;
    background: radial-gradient(ellipse, #c0392b, #8b1a1a);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity: 0;
    pointer-events: none;
    animation: fall linear infinite;
    z-index: 0;
  }
  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* Gold particles */
  .sparkle {
    position: fixed;
    width: 3px;
    height: 3px;
    background: #d4af37;
    border-radius: 50%;
    pointer-events: none;
    animation: sparkle-fall linear infinite;
    opacity: 0;
    z-index: 0;
  }
  @keyframes sparkle-fall {
    0% { transform: translateY(-10px) scale(1); opacity: 1; }
    50% { opacity: 0.6; }
    100% { transform: translateY(110vh) scale(0.3); opacity: 0; }
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .page.active { display: flex; }

  /* ---- INTRO PAGE ---- */
  #intro {
    text-align: center;
  }
  .gold-line {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #d4af37, transparent);
    margin: 20px auto;
  }
  .intro-subtitle {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #d4af37;
    margin-bottom: 16px;
  }
  .intro-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(60px, 15vw, 100px);
    font-style: italic;
    color: #f5e6d0;
    line-height: 1;
    text-shadow: 0 0 60px rgba(212,175,55,0.3);
    margin: 10px 0;
  }
  .intro-wish {
    font-size: clamp(16px, 4vw, 22px);
    font-style: italic;
    color: #c9a96e;
    margin: 10px 0 30px;
    letter-spacing: 1px;
  }
  .open-btn {
    background: transparent;
    border: 1px solid #d4af37;
    color: #d4af37;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 14px 40px;
    cursor: pointer;
    transition: all 0.4s;
    position: relative;
    overflow: hidden;
  }
  .open-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: #d4af37;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s;
    z-index: -1;
  }
  .open-btn:hover::before { transform: scaleX(1); }
  .open-btn:hover { color: #1a0a0a; }

  .rose-row {
    display: flex;
    gap: 20px;
    margin: 24px 0;
    font-size: 28px;
  }

  /* ---- LETTER PAGE ---- */
  #letter {
    max-width: 700px;
    width: 100%;
  }
  .letter-card {
    background: linear-gradient(145deg, #2a1010, #1f0d0d);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 2px;
    padding: clamp(30px, 6vw, 60px);
    position: relative;
    box-shadow: 0 0 80px rgba(139,26,26,0.2), inset 0 0 60px rgba(0,0,0,0.3);
  }
  .letter-card::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(212,175,55,0.1);
    pointer-events: none;
  }
  .letter-header {
    text-align: center;
    margin-bottom: 30px;
  }
  .letter-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 5vw, 34px);
    font-style: italic;
    color: #d4af37;
    margin-bottom: 8px;
  }

  /* Tall letter textarea */
  #letter-text {
    width: 100%;
    min-height: 320px;
    background: rgba(255,255,255,0.03);
    border: none;
    border-bottom: 1px solid rgba(212,175,55,0.2);
    color: #f5e6d0;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(16px, 3vw, 20px);
    font-style: italic;
    line-height: 1.9;
    resize: vertical;
    outline: none;
    padding: 16px 4px;
    transition: border-color 0.3s;
  }
  #letter-text::placeholder { color: rgba(212,175,55,0.3); font-style: italic; }
  #letter-text:focus { border-bottom-color: #d4af37; }

  /* Display area */
  #letter-display {
    display: none;
    min-height: 200px;
    font-size: clamp(16px, 3vw, 20px);
    font-style: italic;
    line-height: 1.9;
    color: #f5e6d0;
    white-space: pre-wrap;
    padding: 8px 4px;
  }

  .letter-footer {
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .letter-signature {
    font-size: 15px;
    color: #c9a96e;
    font-style: italic;
  }
  .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }

  .gold-btn {
    background: #d4af37;
    border: none;
    color: #1a0a0a;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 12px 28px;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.3s;
  }
  .gold-btn:hover { background: #c9a96e; transform: translateY(-1px); }

  .ghost-btn {
    background: transparent;
    border: 1px solid rgba(212,175,55,0.4);
    color: #d4af37;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 12px 28px;
    cursor: pointer;
    border-radius: 1px;
    transition: all 0.3s;
  }
  .ghost-btn:hover { border-color: #d4af37; background: rgba(212,175,55,0.05); }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    color: #c9a96e;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    margin-bottom: 30px;
    opacity: 0.7;
    transition: opacity 0.3s;
  }
  .back-btn:hover { opacity: 1; }

  /* Candles */
  .candles {
    display: flex;
    gap: 8px;
    margin: 16px auto;
    justify-content: center;
  }
  .candle {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    animation: candle-sway 2s ease-in-out infinite;
  }
  .candle:nth-child(2) { animation-delay: 0.3s; }
  .candle:nth-child(3) { animation-delay: 0.6s; }
  @keyframes candle-sway {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
  }
  .flame {
    width: 8px;
    height: 14px;
    background: radial-gradient(ellipse at 50% 80%, #fff 0%, #ffd700 40%, #ff6600 70%, transparent 100%);
    border-radius: 50% 50% 30% 30%;
    animation: flicker 0.15s ease-in-out infinite alternate;
  }
  @keyframes flicker {
    0% { transform: scaleY(1) scaleX(1); opacity: 1; }
    100% { transform: scaleY(0.9) scaleX(1.1); opacity: 0.85; }
  }
  .wick { width: 1px; height: 6px; background: #555; }
  .wax { width: 10px; height: 30px; background: linear-gradient(180deg, #f5e6d0, #e8d5b7); border-radius: 2px 2px 0 0; }

  /* Transition animation */
  .page { animation: fadeIn 0.8s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- Falling petals & sparkles injected by JS -->

<!-- PAGE 1: INTRO -->
<div class="page active" id="intro">
  <p class="intro-subtitle">A birthday celebration for</p>
  <div class="gold-line"></div>
  <h1 class="intro-name">JORY</h1>
  <div class="gold-line"></div>
  <p class="intro-wish">With all my love, on your special day</p>

  <div class="candles">
    <div class="candle"><div class="flame"></div><div class="wick"></div><div class="wax"></div></div>
    <div class="candle"><div class="flame"></div><div class="wick"></div><div class="wax"></div></div>
    <div class="candle"><div class="flame"></div><div class="wick"></div><div class="wax"></div></div>
  </div>

  <div class="rose-row">🌹🌹🌹</div>

  <button class="open-btn" onclick="showLetter()">Open My Letter To You</button>
</div>

<!-- PAGE 2: LETTER -->
<div class="page" id="letter">
  <div style="width:100%; max-width:700px;">
    <button class="back-btn" onclick="showIntro()">← Back</button>
  </div>

  <div class="letter-card">
    <div class="letter-header">
      <h2>My Dearest JORY,</h2>
      <div class="gold-line"></div>
    </div>

    <textarea id="letter-text" placeholder="SDFSDFSFSDFD;FLJDFJGDFKLJGKLDJGKLSDJGKLSDJGKLSDJGKLSDJGKLSDJGKLSDJGKLSDJGKLSDKLGJSDKJGSDKLJGKLSDJGKLSDJGKLSDJGKLSDJGKLSDJKLRHGODFHIODFJGIODJGIODFJGIOJSRGO ✍️"></textarea>
    <div id="letter-display"></div>

    <div class="letter-footer">
      <span class="letter-signature">Forever yours, with love 🌹</span>
      <div class="btn-group">
        <button class="ghost-btn" id="edit-btn" onclick="editLetter()" style="display:none;">Edit</button>
        <button class="gold-btn" id="save-btn" onclick="saveLetter()">Save Letter</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Generate falling petals
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (4 + Math.random() * 6) + 's';
    p.style.animationDelay = (Math.random() * 8) + 's';
    p.style.transform = `scale(${0.5 + Math.random()})`;
    document.body.appendChild(p);
  }

  // Generate sparkles
  for (let i = 0; i < 25; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (3 + Math.random() * 7) + 's';
    s.style.animationDelay = (Math.random() * 10) + 's';
    document.body.appendChild(s);
  }

  function showLetter() {
    document.getElementById('intro').classList.remove('active');
    document.getElementById('letter').classList.add('active');
  }

  function showIntro() {
    document.getElementById('letter').classList.remove('active');
    document.getElementById('intro').classList.add('active');
  }

  function saveLetter() {
    const text = document.getElementById('letter-text').value.trim();
    if (!text) { alert('Please write something for JORY first 💌'); return; }
    const display = document.getElementById('letter-display');
    display.textContent = text;
    display.style.display = 'block';
    document.getElementById('letter-text').style.display = 'none';
    document.getElementById('save-btn').style.display = 'none';
    document.getElementById('edit-btn').style.display = 'inline-block';
  }

  function editLetter() {
    document.getElementById('letter-display').style.display = 'none';
    document.getElementById('letter-text').style.display = 'block';
    document.getElementById('save-btn').style.display = 'inline-block';
    document.getElementById('edit-btn').style.display = 'none';
  }
</script>
</body>
</html>
